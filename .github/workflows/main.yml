name: Build 0.2.45 with Steam Frame haptics fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Allow long file names on Windows
        run: git config --system core.longpaths true

      - name: Get the 0.2.45 release source (with its pinned components)
        uses: actions/checkout@v4
        with:
          ref: 0.2.45
          # true, not recursive: one optional sub-project points at a version that no longer exists
          # online, and the plugin build does not use it.
          submodules: true

      - name: Use the game 2.5 RED4ext SDK this code was written for
        run: |
          git -C externals/RED4ext.SDK fetch --depth 1 https://github.com/WopsS/RED4ext.SDK.git 26cf86702647c06bae2f1a92cb5affc64ab65d23
          git -C externals/RED4ext.SDK checkout --force FETCH_HEAD
          git -C externals/RED4ext.SDK log -1 --format="SDK is now at %h %ad %s"

      - name: Add the Steam Frame haptic bindings
        shell: python
        run: |
          import re, sys
          p = 'src/Runtimes/OpenXRManager.cpp'
          s = open(p, 'rb').read()
          nl = b'\r\n' if b'\r\n' in s else b'\n'
          needle = b'{ m_steamFrameActions.bumper,"/user/hand/right/input/bumper/click" },'
          if re.search(rb'(?s)m_steamFrameActions\.bumper,"/user/hand/right.{0,300}?m_hapticAction', s):
              print('Already patched, nothing to do.'); sys.exit(0)
          if s.count(needle) != 1:
              sys.exit('Expected line not found exactly once; the source changed, stop here.')
          ind = b' ' * 16
          add = (needle + nl +
                 ind + b'{ m_hapticAction,            "/user/hand/left/output/haptic" },' + nl +
                 ind + b'{ m_hapticAction,            "/user/hand/right/output/haptic" },')
          open(p, 'wb').write(s.replace(needle, add))
          print('Patched.')

      - name: Skip a developer-tools folder this release forgot to include
        shell: python
        run: |
          p = 'CMakeLists.txt'
          s = open(p, 'rb').read()
          old = b'add_subdirectory(tools/rtti_dump)'
          i = s.find(old)
          if s.count(old) == 1 and b'if(EXISTS' not in s[max(0, i - 120):i]:
              new = (b'if(EXISTS "${CMAKE_CURRENT_SOURCE_DIR}/tools/rtti_dump/CMakeLists.txt")\n'
                     b'    add_subdirectory(tools/rtti_dump)\n'
                     b'endif()')
              open(p, 'wb').write(s.replace(old, new))
              print('Guarded the rtti_dump line.')
          else:
              print('Nothing to do.')

      - name: Show the change
        run: git diff --stat

      - name: Configure
        run: cmake -S . -B C:/b -A x64

      - name: Build the plugin
        run: cmake --build C:/b --config Release --target cyberpunkvrport_stereo --parallel

      - name: List the result
        shell: pwsh
        run: Get-ChildItem C:/b/bin -Recurse -Filter cyberpunkvrport.dll | Select-Object FullName, Length

      - name: Upload the DLL
        uses: actions/upload-artifact@v4
        with:
          name: cyberpunkvrport-0.2.45-steamframe-haptics
          path: C:/b/bin/**/cyberpunkvrport.dll
          if-no-files-found: error
